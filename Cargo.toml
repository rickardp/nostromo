[package]
name = "nostromo"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
description = "Managed Cargo build storage on macOS and Linux, with optional APFS CoW reuse"
keywords = ["cargo", "build-cache", "worktree", "apfs"]
categories = ["development-tools::cargo-plugins"]

[dependencies]
libc = "0.2.191"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
toml = "1.1.5"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
