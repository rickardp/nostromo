name: Release

on:
  push:
    tags:
      - '**'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install stable Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
      - name: Test
        run: cargo test --locked

  release:
    name: Publish crate and GitHub release
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check tag matches crate version
        id: crate
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          import tomllib

          with open('Cargo.toml', 'rb') as manifest:
              package = tomllib.load(manifest)['package']
          version = package['version']
          tag = os.environ['RELEASE_TAG']
          if tag not in (version, f'v{version}'):
              raise SystemExit(f'Tag {tag!r} must be {version!r} or {"v" + version!r} to match Cargo.toml')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print(f'name={package["name"]}', file=output)
              print(f'version={version}', file=output)
          PY
      - name: Install stable Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          CRATE_NAME: ${{ steps.crate.outputs.name }}
          CRATE_VERSION: ${{ steps.crate.outputs.version }}
        run: |
          # A rerun can finish the GitHub release after a successful crate upload.
          status=$(curl --silent --show-error --location --retry 3 \
            --user-agent "nostromo-release ($GITHUB_REPOSITORY)" \
            --output /dev/null --write-out '%{http_code}' \
            "https://crates.io/api/v1/crates/$CRATE_NAME/$CRATE_VERSION")
          case "$status" in
            200) echo "$CRATE_NAME $CRATE_VERSION is already published; skipping upload." ;;
            404)
              if [[ -z "$CARGO_REGISTRY_TOKEN" ]]; then
                echo '::error::Set the CARGO_REGISTRY_TOKEN repository secret.'
                exit 1
              fi
              cargo publish --locked --registry crates-io
              ;;
            *) echo "::error::crates.io version lookup returned HTTP $status"; exit 1 ;;
          esac
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          CRATE_VERSION: ${{ steps.crate.outputs.version }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists."
          else
            flags=(--verify-tag --generate-notes --title "$RELEASE_TAG")
            if [[ "$CRATE_VERSION" == *-* ]]; then
              flags+=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" "${flags[@]}"
          fi
